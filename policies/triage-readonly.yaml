apiVersion: agentic.dev/v0
kind: Policy
metadata:
  name: triage-readonly
spec:
  execution:
    maxWallClockSeconds: 300
    maxTotalCostUsd: 5
  # The Triager observes only: read GitHub, read the workspace, run tests.
  effects:
    permit:
      - github.read
      - workspace.read
      - process.exec
