apiVersion: agentic.dev/v0
kind: Policy
metadata:
  name: publishing
spec:
  # The workflow-level policy is the runtime gate for every step (Terfyn
  # docs/AGENT_LOOP.md). It permits all non-publishing effects unattended and
  # gates the two publishing operations behind human approval.
  execution:
    maxWallClockSeconds: 900
    maxTotalCostUsd: 20
  effects:
    permit:
      - github.read
      - workspace.read
      - workspace.write
      - process.exec
      - repository.write      # local branch creation
    permitWithApproval:
      - network.write         # git.push_branch
      - github.write          # github.pull_request.post_comment
  approvals:
    requiredFor:
      - tool.git.push_branch
      - tool.github.pull_request.post_comment
  hitl:
    descriptionPrefix: Publishing requires human approval
    interruptOn:
      git:
        allowedDecisions: [approve, reject]
        description: "Review publish call (${uses})"
      github:
        allowedDecisions: [approve, reject]
        description: "Review publish call (${uses})"
