apiVersion: agentic.dev/v0
kind: Project
metadata:
  name: terfyn-maintainer
spec:
  # Everything — agents, workflow, tools, policies — is authored inline in
  # main.agent (ADR 005). Only the JSON schemas sit beside it; nothing to import.
  defaults:
    model: mock/gpt-4
    policy: publishing
  providers:
    models:
      mock:
        type: mock
