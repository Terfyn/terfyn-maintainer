apiVersion: agentic.dev/v0
kind: Tool
metadata:
  name: workspace
spec:
  # Terfyn's native filesystem + test-runner adapter (v0.2.0). read_file/write_file
  # operate inside TERFYN_WORKSPACE_ROOT (a ".." escape is rejected); run_tests runs
  # the operator-configured TERFYN_WORKSPACE_TEST_COMMAND, never a command the agent
  # chooses. Declaring operations makes this a closed-world manifest.
  type: native
  safety:
    trusted: true
    sideEffects: true
  operations:
    read_file:
      effects: [workspace.read]
    write_file:
      effects: [workspace.write]
    run_tests:
      effects: [process.exec]
